name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py check --settings=config.settings_test
      - run: python backend/manage.py test apps.core apps.catalog apps.services apps.projects apps.leads apps.blog --settings=config.settings_test
      - run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ENV_FILE: .env.production.example
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
      - run: docker build -t sabz-greenhouse-backend:ci backend
      - run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1 -t sabz-greenhouse-frontend:ci frontend
